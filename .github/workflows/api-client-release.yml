name: Publish API client

on:
  push:
    tags:
      - "api-client-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@traviswayneenterprise"
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME#api-client-v}" = "$(node -p "require('./packages/api-client/package.json').version")"
      - run: pnpm --dir packages/api-client publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

